kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /
        containerPath: /host
        readOnly: true
    extraPortMappings:
      - {containerPort: 30081, hostPort: 30081, listenAddress: "127.0.0.1"}
      - {containerPort: 30082, hostPort: 30082, listenAddress: "127.0.0.1"}
